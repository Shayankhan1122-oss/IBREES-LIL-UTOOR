<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - IBREES-LIL-UTOOR Admin</title>
    <link rel="stylesheet" href="css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="admin-dashboard">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="logo">
                <h1>Qari Admin</h1>
            </div>
            <nav class="admin-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                    <li><a href="products.html" class="active"><i class="fas fa-box"></i> <span>Products</span></a></li>
                    <li><a href="categories.html"><i class="fas fa-tags"></i> <span>Categories</span></a></li>
                    <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> <span>Orders</span></a></li>
                    <li><a href="customers.html"><i class="fas fa-users"></i> <span>Customers</span></a></li>
                    <li><a href="inventory.html"><i class="fas fa-warehouse"></i> <span>Inventory</span></a></li>
                    <li><a href="reports.html"><i class="fas fa-chart-bar"></i> <span>Reports</span></a></li>
                    <li><a href="settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
                    <li><a href="#" id="admin-logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
                </ul>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-content">
            <header class="admin-header">
                <h1>Product Management</h1>
                <div class="user-info">
                    <div class="user-icon">
                        <i class="fas fa-user"></i>
                    </div>
                    <span>Admin</span>
                </div>
            </header>
            
            <!-- Controls -->
            <div class="controls">
                <button class="btn btn-primary" id="add-product-btn">
                    <i class="fas fa-plus"></i> Add New Product
                </button>
                <div class="search-filter">
                    <input type="text" id="product-search" placeholder="Search products...">
                    <select id="category-filter">
                        <option value="">All Categories</option>
                        <option value="fragrances">Fragrances</option>
                        <option value="clothes">Clothes</option>
                        <option value="agricultural">Agricultural Products</option>
                        <option value="home-textiles">Home Textiles</option>
                    </select>
                    <select id="status-filter">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
            
            <!-- Products Table -->
            <div class="table-container">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Product Name</th>
                            <th>SKU</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body">
                        <!-- Products will be loaded dynamically -->
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="pagination">
                <button class="btn btn-secondary" id="prev-page">Previous</button>
                <span>Page <span id="current-page">1</span> of <span id="total-pages">5</span></span>
                <button class="btn btn-secondary" id="next-page">Next</button>
            </div>
        </main>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal" id="product-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add New Product</h2>
                <span class="close" id="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="product-form">
                    <div class="form-group">
                        <label for="product-name">Product Name</label>
                        <input type="text" id="product-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="product-sku">SKU</label>
                        <input type="text" id="product-sku" name="sku" required>
                    </div>
                    <div class="form-group">
                        <label for="product-category">Category</label>
                        <select id="product-category" name="category" required>
                            <option value="fragrances">Fragrances</option>
                            <option value="clothes">Clothes</option>
                            <option value="agricultural">Agricultural Products</option>
                            <option value="home-textiles">Home Textiles</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-price">Price</label>
                        <input type="number" id="product-price" name="price" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="product-stock">Stock Quantity</label>
                        <input type="number" id="product-stock" name="stock" required>
                    </div>
                    <div class="form-group">
                        <label for="product-status">Status</label>
                        <select id="product-status" name="status" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-description">Description</label>
                        <textarea id="product-description" name="description" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="product-images">Product Images</label>
                        <input type="file" id="product-images" name="images" multiple accept="image/*">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancel-modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/admin-products.js"></script>
</body>
</html>
