<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - IBREES-LIL-UTOOR</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar h2 {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #34495e;
        }

        .sidebar a.active {
            background: #3498db;
        }

        /* Main content */
        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        input[type="text"],
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Table */
        .table-wrapper {
            background: white;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
        }

        img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .btn-edit {
            background: #3498db;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .pagination {
            text-align: center;
            padding: 20px;
        }

        .pagination button {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>IBREES-LIL-UTOOR</h2>
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="products.html" class="active">📦 Products</a>
            <a href="orders.html">🛒 Orders</a>
            <a href="customers.html">👥 Customers</a>
            <a href="settings.html">⚙️ Settings</a>
            <a href="#" onclick="logout()">🚪 Logout</a>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>Product Management</h1>
                <span id="admin-name">Admin</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn btn-primary" onclick="openAddModal()">➕ Add New Product</button>
                <input type="text" id="search" placeholder="Search products..." onkeyup="filterProducts()">
                <select id="category-filter" onchange="filterProducts()">
                    <option value="">All Categories</option>
                    <option value="fragrances">Premium Attar & Perfumes</option>
                    <option value="clothes">Male & Female Fashion</option>
                    <option value="agricultural">Fresh Agricultural Products</option>
                    <option value="home-textiles">Quality Home Essentials</option>
                </select>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>SKU</th>
                            <th>Category</th>
                            <th>Price (PKR)</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <tr>
                            <td colspan="8" style="text-align: center;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button class="btn btn-secondary" onclick="prevPage()">Previous</button>
                <span>Page <span id="current-page">1</span> of <span id="total-pages">1</span></span>
                <button class="btn btn-secondary" onclick="nextPage()">Next</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add New Product</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="product-form" onsubmit="saveProduct(event)">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label>SKU *</label>
                    <input type="text" id="sku" required>
                </div>
                
                <div class="form-group">
                    <label>Category *</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="fragrances">Premium Attar & Perfumes</option>
                        <option value="clothes">Male & Female Fashion</option>
                        <option value="agricultural">Fresh Agricultural Products</option>
                        <option value="home-textiles">Quality Home Essentials</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Price (PKR) *</label>
                    <input type="number" id="price" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label>Stock *</label>
                    <input type="number" id="stock" required>
                </div>
                
                <div class="form-group">
                    <label>Status *</label>
                    <select id="status" required>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allProducts = [];
        let filteredProducts = [];
        let currentPage = 1;
        const perPage = 10;

        // Category mapping - display names
        const categoryNames = {
            'fragrances': 'Premium Attar & Perfumes',
            'clothes': 'Male & Female Fashion',
            'agricultural': 'Fresh Agricultural Products',
            'home-textiles': 'Quality Home Essentials'
        };

        // Logout
        function logout() {
            if (confirm('Logout?')) {
                localStorage.removeItem('admin');
                window.location.href = '/admin/login.html';
            }
        }

        // Load products
        async function loadProducts() {
            try {
                const res = await fetch('/api/admin/products');
                const data = await res.json();
                allProducts = data.success ? data.products : (Array.isArray(data) ? data : []);
                filterProducts();
            } catch (e) {
                console.error(e);
                document.getElementById('products-tbody').innerHTML = '<tr><td colspan="8" style="text-align:center;color:red;">Error loading products</td></tr>';
            }
        }

        // Filter
        function filterProducts() {
            const search = document.getElementById('search').value.toLowerCase();
            const cat = document.getElementById('category-filter').value;
            
            filteredProducts = allProducts.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(search) || p.sku.toLowerCase().includes(search);
                const matchCat = !cat || p.category === cat;
                return matchSearch && matchCat;
            });
            
            currentPage = 1;
            renderProducts();
        }

        // Render
        function renderProducts() {
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const page = filteredProducts.slice(start, end);
            
            const tbody = document.getElementById('products-tbody');
            
            if (page.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No products</td></tr>';
            } else {
                tbody.innerHTML = page.map(p => `
                    <tr>
                        <td><img src="${p.image}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2250%22 height=%2250%22%3E%3Crect fill=%22%23ddd%22 width=%2250%22 height=%2250%22/%3E%3C/svg%3E'"></td>
                        <td>${p.name}</td>
                        <td>${p.sku}</td>
                        <td>${categoryNames[p.category] || p.category}</td>
                        <td>Rs ${p.price.toFixed(2)}</td>
                        <td>${p.stock}</td>
                        <td><span class="status-active">${p.status}</span></td>
                        <td>
                            <button class="btn-edit" onclick="editProduct(${p.id})">Edit</button>
                            <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            }
            
            const totalPages = Math.ceil(filteredProducts.length / perPage) || 1;
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = totalPages;
        }

        // Pagination
        function nextPage() {
            const totalPages = Math.ceil(filteredProducts.length / perPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderProducts();
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderProducts();
            }
        }

        // Modal
        function openAddModal() {
            document.getElementById('modal-title').textContent = 'Add New Product';
            document.getElementById('product-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('product-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.remove('show');
        }

        function editProduct(id) {
            const p = allProducts.find(x => x.id === id);
            if (!p) return;
            
            document.getElementById('modal-title').textContent = 'Edit Product';
            document.getElementById('edit-id').value = id;
            document.getElementById('name').value = p.name;
            document.getElementById('sku').value = p.sku;
            document.getElementById('category').value = p.category;
            document.getElementById('price').value = p.price;
            document.getElementById('stock').value = p.stock;
            document.getElementById('status').value = p.status;
            document.getElementById('description').value = p.description || '';
            document.getElementById('product-modal').classList.add('show');
        }

        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            
            try {
                const res = await fetch(`/api/admin/products?id=${id}`, { method: 'DELETE' });
                const data = await res.json();
                
                if (data.success) {
                    alert('Deleted!');
                    loadProducts();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (e) {
                alert('Failed to delete');
            }
        }

        async function saveProduct(e) {
            e.preventDefault();
            
            const id = document.getElementById('edit-id').value;
            const product = {
                name: document.getElementById('name').value.trim(),
                sku: document.getElementById('sku').value.trim(),
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value),
                stock: parseInt(document.getElementById('stock').value),
                status: document.getElementById('status').value,
                description: document.getElementById('description').value.trim()
            };
            
            try {
                let res;
                if (id) {
                    res = await fetch(`/api/admin/products?id=${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(product)
                    });
                } else {
                    res = await fetch('/api/admin/products', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(product)
                    });
                }
                
                const data = await res.json();
                
                if (data.success) {
                    alert(id ? 'Product updated successfully!' : 'Product added successfully!');
                    closeModal();
                    loadProducts();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (e) {
                alert('Failed to save product');
            }
        }

        // Init
        loadProducts();
    </script>
</body>
</html>
